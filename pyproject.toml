[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchpilot"
version = "0.2.0"
description = "A grounded, auditable agentic research assistant for mathematical and ML research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ResearchPilot contributors"}]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-dotenv>=1.0", "markdown-it-py>=3.0"]
science = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.9"]
literature = ["pypdf>=6.0"]
math = ["sympy>=1.14"]
embeddings = ["sentence-transformers>=3.0"]
telemetry = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
identity = ["PyJWT[crypto]>=2.10"]
dev = ["pytest>=8.0", "ruff>=0.8", "httpx>=0.27"]

[project.scripts]
researchpilot = "researchpilot.cli:main"

[tool.setuptools.packages.find]
include = ["researchpilot*"]

[tool.setuptools.package-data]
researchpilot = ["evaluation_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
